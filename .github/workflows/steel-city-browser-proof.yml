name: Steel City Browser Proof
on:
  push:
    branches:
      - main
      - build/restore-steel-city-saga
      - fix/steel-city-hillside-parity-20261115
      - claude/magical-fermat-psq8s1
      - feat/cinematic-composition-contract-20261126
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: steel-city-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 pillow==11.0.0
          python -m playwright install chromium
      - name: Verify native source contracts (not Unreal compilation)
        run: python tests/verify_native_source.py
      - name: Verify collection boundary and emissive light selection
        run: python tests/verify_candidate_contract.py
      - name: Desktop and mobile-emulated gameplay + cinematic gate
        run: python tests/verify_browser.py
      - name: Touch layout on portrait, landscape, tablet and desktop screens
        run: python tests/verify_touch_layout.py
      - name: Verify approved skyline export matches source
        run: python scripts/export_graphics.py
      - name: Desktop and mobile joystick, camera, and skyline proof
        run: python tests/verify_joystick.py
      - name: Verify 3D scene WebGL rendering (software GPU, not production proof)
        run: xvfb-run -a python tests/verify_webgl.py
      - name: Verify screen-space bloom pixels, resize and opt-out (software GPU)
        run: xvfb-run -a python tests/verify_bloom.py
      - name: Storyboard cast in WebGL and canvas fallback (software GPU, not production proof)
        run: xvfb-run -a python tests/verify_cast.py
      - name: Playwright parity for eleven hillside houses across WebGL and canvas
        run: python tests/verify_hillside_parity.py
      - name: Cross-check approved art and playable 3D graphics lanes
        run: python scripts/verify_graphics_lanes.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        if: always()
        with:
          name: steel-city-webgl-${{ github.sha }}
          path: proof/steel-city/
          retention-days: 30
